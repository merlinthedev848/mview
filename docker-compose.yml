services:
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: sentinel-go2rtc
    network_mode: host
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    restart: unless-stopped

  api:
    build:
      context: ./
      dockerfile: api/Dockerfile
    container_name: sentinel-api
    network_mode: host          # Host networking so ONVIF UDP multicast reaches LAN cameras
    security_opt:
      - apparmor=unconfined
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; run ./install.sh}@127.0.0.1:5432/${POSTGRES_DB:-sentinelnvr}
      - REDIS_URL=redis://127.0.0.1:6379/0
      - MQTT_BROKER=127.0.0.1
      - MQTT_USERNAME=${MQTT_USERNAME:?MQTT_USERNAME must be set; run ./install.sh}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set; run ./install.sh}
      - SENTINEL_JWT_SECRET=${SENTINEL_JWT_SECRET:?SENTINEL_JWT_SECRET must be set; run ./install.sh}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set; run ./install.sh}
      - RECORDINGS_DIR=/mnt/storage/mview/recordings
      - SEGMENT_SECONDS=60
      - RECORD_SUBSTREAM_DEFAULT=true
      - RECORD_VIDEO_CODEC=copy
      - RECORD_VIDEO_CRF=30
      - RECORD_VIDEO_PRESET=veryfast
    volumes:
      - /mnt/storage/mview/recordings:/mnt/storage/mview/recordings
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/mview-sentinel:/opt/mview-sentinel
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: sentinel-detector
    network_mode: host
    security_opt:
      - apparmor=unconfined
    environment:
      - MQTT_BROKER=127.0.0.1
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:?MQTT_USERNAME must be set; run ./install.sh}
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set; run ./install.sh}
      - STREAM_URL=rtsp://127.0.0.1:8554/camera1
      - CAMERA_ID=default_cam
      - ACCELERATOR=cpu
      - DETECTOR_MODEL=yolov8n.pt
      - FRAME_STRIDE=6
      - IMAGE_SIZE=640
      - MIN_CONFIDENCE=0.5
      - EVENT_COOLDOWN_SECONDS=5
      - DETECT_CLASSES=0,2,3,5,7
    depends_on:
      - mqtt
      - go2rtc
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: sentinel-postgres
    security_opt:
      - apparmor=unconfined
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sentinel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set; run ./install.sh}
      - POSTGRES_DB=${POSTGRES_DB:-sentinelnvr}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-sentinel}\" -d \"$${POSTGRES_DB:-sentinelnvr}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2-alpine
    container_name: sentinel-redis
    security_opt:
      - apparmor=unconfined
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: sentinel-mqtt
    security_opt:
      - apparmor=unconfined
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./config/passwords:/mosquitto/config/passwords:ro
    ports:
      - "127.0.0.1:1883:1883"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
